<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="edusphere-api-url" content="%VITE_API_URL%">
<title>EduSphere Admin Dashboard</title>
<meta name="description" content="EduSphere administrator dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Apply saved theme before first paint to avoid a flash */
try{var p=JSON.parse(localStorage.getItem('edusphere.prefs.v1')||'null');if(p&&p.theme)document.documentElement.setAttribute('data-theme',p.theme);}catch(e){}
</script>
<style>
:root{
  --bg:#f4f7fe;--card:#ffffff;--text:#0f1b3d;--muted:#64748b;--border:#e6ebf5;
  --primary:#2563eb;--primary-d:#1d4ed8;--soft:#eef3ff;--input:#ffffff;--row:#f7f9fe;
  --shadow:0 1px 2px rgba(15,27,61,.04),0 10px 30px rgba(37,99,235,.07);
  --ok:#16a34a;--ok-bg:#e8f8ee;--warn:#b45309;--warn-bg:#fff4e0;--bad:#dc2626;--bad-bg:#fdecec;--off:#64748b;--off-bg:#eef1f6;--info:#2563eb;--info-bg:#e8efff;
}
[data-theme="dark"]{
  --bg:#0a1124;--card:#111a35;--text:#e8edfb;--muted:#93a1c0;--border:#223055;
  --soft:#18264d;--input:#0d1530;--row:#0f1832;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --ok:#4ade80;--ok-bg:rgba(34,197,94,.14);--warn:#fbbf24;--warn-bg:rgba(245,158,11,.14);--bad:#f87171;--bad-bg:rgba(239,68,68,.15);--off:#9fb0d0;--off-bg:rgba(148,163,184,.14);--info:#7aa2ff;--info-bg:rgba(59,130,246,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;overflow-x:hidden}
body.noscroll{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.ic{flex:none;display:block}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:#fff;padding:8px 14px;border-radius:8px;z-index:200}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:283px;background:linear-gradient(180deg,#0b1d52 0%,#081433 55%,#060f28 100%);color:#e6ecff;display:flex;flex-direction:column;padding:22px 22px 24px;z-index:60;overflow-y:auto;transition:transform .25s ease}
.brand{display:flex;gap:12px;align-items:center;padding:0 4px 26px}
.brand-name{font-size:26px;font-weight:800;letter-spacing:-.4px;color:#fff;line-height:1}
.brand-tag{font-size:12px;color:#aab8e3;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:12px;color:#dbe4ff;text-decoration:none;font-weight:500;font-size:15.5px;transition:background .15s,transform .15s}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:linear-gradient(90deg,#2f6bff,#2257ee);color:#fff;box-shadow:0 10px 22px rgba(37,99,235,.38)}
.nav .nbadge{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.promo{margin-top:auto;padding-top:24px}
.promo-card{background:linear-gradient(180deg,#0f2160,#0a173f);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:18px 18px 8px}
.promo-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#c9d6ff}
.promo-row b{display:block;color:#fff;font-weight:600}
.promo-row svg{color:#4f8bff;margin-top:2px}
.scrim{position:fixed;inset:0;background:rgba(6,15,40,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}

/* ---------- Layout ---------- */
.content{margin-left:283px;min-height:100vh;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--border);height:74px;display:flex;align-items:center;gap:14px;padding:0 24px}
.menu-btn{display:none}
.gsearch{position:relative;flex:1;max-width:420px}
.gsearch label{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid transparent;border-radius:99px;padding:0 18px;height:44px;color:var(--muted)}
.gsearch label:focus-within{border-color:var(--primary);background:var(--input)}
.gsearch input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:100%;color:var(--text)}
.results{position:absolute;top:52px;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);max-height:360px;overflow:auto;padding:6px;z-index:50}
.results button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--soft)}
.results .tag{margin-left:auto;font-size:11px;color:var(--muted);background:var(--off-bg);padding:2px 8px;border-radius:99px}
.results .none{padding:14px;color:var(--muted);text-align:center}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pop-wrap{position:relative}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .15s,color .15s;position:relative}
.icon-btn:hover{background:var(--soft);color:var(--primary)}
.icon-btn.danger:hover{background:var(--bad-bg);color:var(--bad)}
.bell-badge{position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.admin-btn{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:12px;text-align:left}
.admin-btn:hover{background:var(--soft)}
.admin-btn .nm{font-weight:600;line-height:1.2}
.admin-btn .rl{font-size:12px;color:var(--muted)}
.popover{position:absolute;right:0;top:50px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 50px rgba(15,27,61,.18);width:340px;max-width:calc(100vw - 24px);z-index:60;overflow:hidden}
.popover.small{width:230px}
.pop-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700}
.pop-item{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.pop-item:last-child{border-bottom:0}
.pop-item:hover{background:var(--row)}
.pop-item.unread{background:var(--soft)}
.pop-item .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:none}
.pop-item .dot.read{background:transparent}
.pop-item small{display:block;color:var(--muted)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:11px 16px;cursor:pointer;text-align:left}
.menu-item:hover{background:var(--soft)}
main{flex:1;padding:26px 24px 10px;min-width:0}
main:focus{outline:none}
footer.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:18px 24px 24px;color:var(--muted);font-size:12.5px}

/* ---------- Generic ---------- */
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px}
.page-head h1{font-size:28px;font-weight:700;letter-spacing:-.4px}
.page-head h1:focus{outline:none}
.sub{color:var(--muted);margin-top:4px;font-size:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card-pad{padding:22px}
.card-title{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.card-title h2{font-size:17px;font-weight:700}
.card-title .ic{color:var(--primary)}
.card-sub{color:var(--muted);font-size:13px}
.link-btn{background:none;border:0;color:var(--primary);cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-weight:500;font-size:13px;padding:4px;border-radius:6px}
.link-btn:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;transition:transform .1s,background .15s,box-shadow .15s}
.btn:hover{background:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#3b78ff,#2563eb);border-color:#2563eb;color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.28)}
.btn.primary:hover{background:linear-gradient(180deg,#3170f6,#1d4ed8)}
.btn.danger{background:#dc2626;border-color:#dc2626;color:#fff}
.btn.danger:hover{background:#b91c1c}
.btn.sm{padding:7px 12px;font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:600;background:var(--warn-bg);color:var(--warn);padding:3px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-off{background:var(--off-bg);color:var(--off)}.b-info{background:var(--info-bg);color:var(--info)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;letter-spacing:.3px}
.av.icon-av{background:var(--soft);color:var(--primary);border-radius:12px}
.person{display:flex;align-items:center;gap:12px;min-width:0}
.p-name{font-weight:600}
.p-sub{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.ta-r{text-align:right}

/* toolbar + tables */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:0 12px;height:40px;flex:1 1 240px;max-width:380px;color:var(--muted)}
.sbox:focus-within{border-color:var(--primary)}
.sbox input{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%}
.toolbar select{height:40px;border:1px solid var(--border);border-radius:12px;background:var(--input);padding:0 12px;cursor:pointer;max-width:100%}
.count{margin-left:auto;color:var(--muted);font-size:13px}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:12px 16px;background:var(--row);border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600}
.t td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tbody tr:hover td{background:var(--row)}
.t tbody tr:last-child td{border-bottom:0}
td.actions{white-space:nowrap;text-align:right}
td.actions .icon-btn{width:34px;height:34px}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
.pages{display:flex;gap:4px;flex-wrap:wrap}
.pages button{min-width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;padding:0 8px}
.pages button:hover:not(:disabled){background:var(--soft)}
.pages button[aria-current="page"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.pages button:disabled{opacity:.45;cursor:not-allowed}
.empty{text-align:center;padding:54px 20px;color:var(--muted)}
.empty .eic{width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 14px}
.empty h3{color:var(--text);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:16px}

/* ---------- Dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.dash-main,.dash-side{display:flex;flex-direction:column;gap:22px;min-width:0}
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.hello h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
.date-box{display:flex;gap:12px;align-items:flex-start;color:var(--text)}
.date-box .ic{color:var(--muted);margin-top:2px}
.date-box b{font-weight:600;font-size:15px;display:block}
.date-box span{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{--c:37,99,235;display:block;text-decoration:none;color:inherit;border-radius:16px;padding:16px;background:rgba(var(--c),.07);border:1px solid rgba(var(--c),.16);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px)}
.stat.c-green{--c:34,197,94}.stat.c-purple{--c:147,51,234}.stat.c-orange{--c:245,158,11}.stat.c-rose{--c:236,72,153}
.stat-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stat-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--c),.16);color:rgb(var(--c))}
.stat-l{font-weight:600;font-size:13px;color:rgb(var(--c));filter:brightness(.8)}
[data-theme="dark"] .stat-l{filter:brightness(1.25)}
.stat-v{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.stat-t{font-size:12px;color:var(--ok);margin-top:10px;display:flex;gap:4px;align-items:center}
.stat-t span{color:var(--muted)}
.charts{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px}
.chart-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chart-head select{border:1px solid var(--border);background:var(--input);border-radius:10px;height:34px;padding:0 8px;font-size:13px;max-width:140px}
.line-wrap{position:relative;margin-top:12px}
.line-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;transform:translate(-50%,-125%);background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:10px;padding:6px 10px;font-size:12px;pointer-events:none;white-space:nowrap;transition:left .15s,top .15s}
.tip small{display:block;color:var(--muted)}
.hit{cursor:pointer;outline:none}
.donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:14px;justify-content:center}
.donut{position:relative;width:190px;height:190px;flex:none}
.donut svg{width:100%;height:100%}
.donut .seg{transition:opacity .15s,stroke-width .15s;cursor:pointer}
.donut .seg:hover{stroke-width:30}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c b{font-size:30px;line-height:1}
.donut-c span{font-size:12.5px;color:var(--muted)}
.legend{display:grid;gap:9px;min-width:150px;flex:1}
.legend div{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;flex:none}
.legend b{margin-left:auto;color:var(--text);font-weight:600}
.act-card{padding:22px}
.act-card .t td,.act-card .t th{padding:11px 12px}
.act-ic{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;margin-right:8px;vertical-align:middle}
.mini-person{display:inline-flex;align-items:center;gap:8px}
.mini-person .av{width:22px;height:22px;font-size:9px}
.user-item{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;cursor:pointer;padding:10px 6px;border-radius:12px}
.user-item:hover{background:var(--soft)}
.user-item .av{width:46px;height:46px;font-size:15px}
.user-item small{display:block;color:var(--muted);font-size:12.5px}
.timeline{display:grid;gap:4px;margin-top:10px}
.tl{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:12px}
.tl::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--border)}
.tl:last-child::before{display:none}
.tl i{width:14px;height:14px;border-radius:50%;margin:4px 0 0 3px;border:3px solid var(--card);box-shadow:0 0 0 2px var(--c)}
.tl .tm{color:var(--muted);font-size:13px}
.tl b{font-weight:500;display:block}
.tl small{color:var(--muted)}
.notif-list{display:grid;margin-top:8px}
.notif-list .pop-item{padding:10px 8px;border-radius:10px;border-bottom:1px solid var(--border)}

/* ---------- Messages ---------- */
.msg-wrap{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:560px;overflow:hidden}
.msg-list{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.msg-tools{padding:14px;display:flex;gap:8px;border-bottom:1px solid var(--border)}
.msg-tools .sbox{flex:1;max-width:none}
#convList{overflow-y:auto;max-height:620px}
.conv{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);padding:14px;cursor:pointer;align-items:center}
.conv:hover{background:var(--row)}
.conv.active{background:var(--soft)}
.conv .meta{flex:1;min-width:0}
.conv .row1{display:flex;justify-content:space-between;gap:8px}
.conv .row1 span{font-size:12px;color:var(--muted);white-space:nowrap}
.conv .prev{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.unread .p-name,.conv.unread .prev{font-weight:700;color:var(--text)}
.udot{width:10px;height:10px;border-radius:50%;background:var(--primary);flex:none}
.msg-thread{display:flex;flex-direction:column;min-width:0}
.th-head{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.th-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:480px;min-height:300px}
.bubble{max-width:75%;padding:10px 14px;border-radius:16px;background:var(--off-bg);overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bubble:not(.me){border-bottom-left-radius:4px}
.bubble small{display:block;opacity:.7;font-size:11px;margin-top:3px}
.reply{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border)}
.reply input{flex:1;min-width:0;border:1px solid var(--border);background:var(--input);border-radius:12px;padding:0 14px;height:42px}
.back-btn{display:none}

/* ---------- Forms / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,16,40,.55);display:grid;place-items:center;padding:16px;z-index:100;animation:fade .15s}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s}
.modal.narrow{max-width:440px}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.m-head h2{font-size:18px}
.m-body{padding:20px 22px;overflow-y:auto}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border);flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:13px}
.req{color:var(--bad)}
.field input,.field select,.field textarea{border:1px solid var(--border);background:var(--input);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);outline:2px solid rgba(37,99,235,.2)}
.field [aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:12px;min-height:0}
.hint{color:var(--muted);font-size:12.5px}
.detail-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.detail-head .av{width:56px;height:56px;font-size:19px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:10px 14px}
.dl dt{color:var(--muted);font-weight:500}
.dl dd{margin:0;overflow-wrap:anywhere}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:300;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--ok);border-radius:12px;padding:12px 16px;box-shadow:0 14px 40px rgba(0,0,0,.2);animation:pop .2s;min-width:240px}
.toast.error{border-left-color:var(--bad)}
.toast.info{border-left-color:var(--primary)}
.toast .ic{margin-top:1px}
.toast.success .ic{color:var(--ok)}.toast.error .ic{color:var(--bad)}.toast.info .ic{color:var(--primary)}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-row small{display:block;color:var(--muted)}
.switch{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:#cbd5e1;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.notice{background:var(--info-bg);color:var(--info);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}

/* ---------- Responsive ---------- */
@media (max-width:1280px){
  .dash{grid-template-columns:minmax(0,1fr)}
  .dash-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
}
@media (max-width:1023px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .content{margin-left:0}
  .menu-btn{display:inline-grid}
  .topbar{padding:0 14px}
  main{padding:20px 14px 10px}
  footer.foot{padding:16px 14px 22px}
}
@media (max-width:900px){.charts{grid-template-columns:minmax(0,1fr)}}
@media (max-width:800px){
  .msg-wrap{grid-template-columns:minmax(0,1fr)}
  .msg-wrap .msg-thread{display:none}
  .msg-wrap.show-thread .msg-list{display:none}
  .msg-wrap.show-thread .msg-thread{display:flex}
  .back-btn{display:inline-grid}
}
@media (max-width:720px){
  .t thead{display:none}
  .t,.t tbody,.t tr,.t td{display:block;width:100%}
  .t tr{border:1px solid var(--border);border-radius:14px;margin:12px 0;padding:6px 0;background:var(--card)}
  .t tbody tr:hover td{background:transparent}
  .t td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0!important;padding:8px 14px;text-align:right}
  .t td::before{content:attr(data-label);color:var(--muted);font-weight:600;font-size:12px;text-align:left;flex:none}
  .table-wrap{padding:0 12px}
  .act-card .table-wrap{padding:0}
  .admin-btn .who{display:none}
  .fgrid{grid-template-columns:1fr}
  .dl{grid-template-columns:100px 1fr}
  .hello h1{font-size:24px}
  .page-head h1{font-size:24px}
  .count{margin-left:0;width:100%}
}
@media (max-width:420px){.top-right{gap:2px}.admin-btn .chev{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function ago(ts){
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return 'just now';
  const m=Math.floor(s/60); if(m<60)return m+(m===1?' minute ago':' minutes ago');
  const h=Math.floor(m/60); if(h<24)return h+(h===1?' hour ago':' hours ago');
  const d=Math.floor(h/24); if(d<30)return d+(d===1?' day ago':' days ago');
  return fmtDate(ts);
}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtTime(ts){return new Date(ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function hue(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h%360;}
function initials(n){const p=String(n).trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
function avatar(name,size){
  const h=hue(name);
  const st=`background:linear-gradient(135deg,hsl(${h} 70% 52%),hsl(${(h+35)%360} 70% 42%))${size?`;width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px`:''}`;
  return `<span class="av" style="${st}" aria-hidden="true">${esc(initials(name))}</span>`;
}

  return `<span class="badge b-${m[s]||'off'}">${esc(s)}</span>`;
}
function gradeOf(m,t){const p=t>0?m/t*100:0;return p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':p>=40?'E':'F';}

function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){storageOK=false;return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

const configuredApiUrl=document.querySelector('meta[name="edusphere-api-url"]')?.content.trim()||'';
const ADMIN_API=configuredApiUrl&&!configuredApiUrl.startsWith('%')?`${configuredApiUrl.replace(/\/$/,'').replace(/\/api$/,'')}/api`:'/api';
const CMS_TYPES=new Set(['courses','subjects','quizzes','assignments']);
let connectedUser=null, systemReady=false, systemError='';
function dateValue(value){const parsed=Date.parse(value||'');return Number.isFinite(parsed)?parsed:0;}
function displayStatus(value){

}
async function apiRequest(path,options={},retry=true){
  const headers=new Headers(options.headers||{});
  headers.set('Content-Type','application/json');
  const token=sessionStorage.getItem('edusphere-access-token');
  if(token)headers.set('Authorization','Bearer '+token);
  let response;
  try{response=await fetch(ADMIN_API+path,{...options,headers,credentials:'include'});}
  catch{throw new Error('Unable to connect to the EduSphere API. Check that the server is running.');}
  if(response.status===401&&retry&&path!=='/auth/refresh'){
    const refreshed=await apiRequest('/auth/refresh',{method:'POST'},false).catch(()=>null);
    if(refreshed&&refreshed.accessToken){sessionStorage.setItem('edusphere-access-token',refreshed.accessToken);return apiRequest(path,options,false);}
    sessionStorage.removeItem('edusphere-access-token');
  }
  if(!response.ok){
    const body=await response.json().catch(()=>({}));
    throw new Error(body.error?.message||body.message||(response.status===401?'Your session has expired. Sign in again.':`EduSphere API request failed (${response.status}).`));
  }
  return response.status===204?null:response.json();
}
async function getAllPages(path){
  const rows=[];let offset=0,total=0;
  do{
    const separator=path.includes('?')?'&':'?';
    const result=await apiRequest(`${path}${separator}limit=200&offset=${offset}`);
    if(!Array.isArray(result.data))throw new Error('The EduSphere API returned an invalid list response.');
    rows.push(...result.data);total=Number(result.meta?.total??rows.length);offset+=result.data.length;
    if(!result.data.length)break;
  }while(offset<total);
  return rows;
}
function requireAdminSession(){
  const raw=sessionStorage.getItem('edusphere-user-session');
  try{connectedUser=raw?JSON.parse(raw):null;}catch{connectedUser=null;}
  if(!connectedUser||!['admin','super-admin'].includes(connectedUser.role))throw new Error('Administrator sign-in is required. Sign in to EduSphere with an administrator account, then open this dashboard again.');
}

  requireAdminSession();

    getAllPages('/admin/users?role=student'),
    apiRequest('/admin/teachers'),
    apiRequest('/admin/taxonomy'),
    getAllPages('/admin/content/courses'),
    getAllPages('/admin/content/subjects'),
    getAllPages('/admin/content/quizzes'),
    getAllPages('/admin/content/assignments'),
    getAllPages('/admin/schools'),
    apiRequest('/admin/results'),
    apiRequest('/admin/activities'),
    apiRequest('/admin/notifications'),
    apiRequest('/admin/classes'),
    apiRequest('/messages')

function showSystemError(message){
  systemReady=false;systemError=message;

}
async function refreshSystem(){
  try{await connectSystem();applyBranding();render();toast('Live EduSphere data refreshed.');}

}

  el.innerHTML=`${icon(type==='error'?'alert':type==='info'?'info':'check',18)}<div>${esc(msg)}</div>`;
  const box=$('#toasts');box.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},type==='error'?5000:3200);
  while(box.children.length>4)box.firstChild.remove();
}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));for(const m of [1,2,3,5,10])if(m*p>=x)return m*p;return 10*p;}
function drawLine(metric){
  const n=new Date(),labels=[];for(let i=3;i>=0;i--)labels.push(new Date(n.getFullYear(),n.getMonth()-i,1).toLocaleString('en-US',{month:'short'}));
  const vals=(metric==='signups'?DB.chart.signups:DB.chart.active).slice();
  if(metric!=='signups')vals[3]=DB.students.length;
  $('#actSub').textContent=metric==='signups'?'Monthly new sign-ups':'Monthly active students';
  const W=640,Hh=300,L=52,R=26,T=24,B=36,iw=W-L-R,ih=Hh-T-B;
  const step=niceStep(Math.max(...vals,1)/5),max=step*5;
  const X=i=>L+14+(iw-28)*i/(vals.length-1),Y=v=>T+ih-(v/max)*ih;
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  const area=`${d} L${pts[pts.length-1][0]},${T+ih} L${pts[0][0]},${T+ih} Z`;
  let grid='';for(let i=0;i<=5;i++){const v=step*i,y=Y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 5"/><text x="${L-10}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(v)}</text>`;}
  const xl=labels.map((l,i)=>`<text x="${X(i)}" y="${Hh-10}" text-anchor="middle" font-size="12.5" fill="var(--muted)">${l}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:4.5}" fill="${i===pts.length-1?'#2563eb':'var(--card)'}" stroke="#2563eb" stroke-width="2.5"/><circle class="hit" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="16" fill="transparent" tabindex="0" role="img" aria-label="${labels[i]}: ${fmt(vals[i])}"/>`).join('');
  const w=$('#lineWrap');
  w.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Line chart of ${metric==='signups'?'new sign-ups':'active students'} for the last four months"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".28"/><stop offset="1" stop-color="#2563eb" stop-opacity=".02"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#ag)"/><path d="${d}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>${xl}${dots}</svg><div class="tip" id="tip"></div>`;
  const tip=$('#tip',w);
  const show=i=>{tip.style.left=(pts[i][0]/W*100)+'%';tip.style.top=(pts[i][1]/Hh*100)+'%';tip.innerHTML=`${labels[i]}<small><b>${fmt(vals[i])}</b> ${metric==='signups'?'sign-ups':'students'}</small>`;};
  show(vals.length-1);
  $$('.hit',w).forEach(c=>{const i=+c.dataset.i;c.addEventListener('mouseenter',()=>show(i));c.addEventListener('focus',()=>show(i));});
}
const DONUT_COLORS=['#2563eb','#22c55e','#9333ea','#f59e0b','#06b6d4','#94a3b8'];
function drawDonut(){
  const total=DB.courses.length,w=$('#donutWrap');
  if(!total){w.innerHTML='<div class="empty" style="padding:30px">No courses yet</div>';return;}
  const counts=MAIN_CATS.map(c=>DB.courses.filter(x=>x.subject===c).length);
  counts.push(total-counts.reduce((a,b)=>a+b,0));
  const names=[...MAIN_CATS,'Other'],R=70,C=2*Math.PI*R;let off=0;
  const segs=counts.map((c,i)=>{const len=c/total*C,gap=c?Math.min(3,len*.2):0;const s=`<circle class="seg" cx="100" cy="100" r="${R}" fill="none" stroke="${DONUT_COLORS[i]}" stroke-width="26" stroke-dasharray="${Math.max(len-gap,0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${names[i]}: ${c} courses</title></circle>`;off+=len;return s;}).join('');
  w.innerHTML=`<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Donut chart of course distribution">${segs}</svg><div class="donut-c"><b>${fmt(total)}</b><span>Total Courses</span></div></div>
  <div class="legend">${names.map((n,i)=>`<div><i style="background:${DONUT_COLORS[i]}"></i>${n}<b>${Math.round(counts[i]/total*100)}%</b></div>`).join('')}</div>`;
}

      if(subject.grade_id)data.gradeId=String(subject.grade_id);
    }
    const level=(DB.taxonomyLevels||[]).find(row=>String(row.id)===String(data.educationLevelId));

    if(!level||!grade||String(grade.education_level_id)!==String(level.id)){

function validate(E,form,rec){
  const data={},errs={};
  E.fields.forEach(f=>{
    let v=(form.elements[f.k].value||'').trim(),e='';
    if(f.req&&!v)e=`${f.l} is required.`;
    else if(v){
      if(f.t==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))e='Enter a valid email address.';
      else if(f.t==='email'&&f.unique&&DB[E.key].some(r=>(!rec||r.id!==rec.id)&&String(r.email).toLowerCase()===v.toLowerCase()))e='This email is already in use.';
      else if(f.t==='number'){const n=Number(v);if(!Number.isFinite(n))e='Enter a valid number.';else if(f.min!=null&&n<f.min)e=`Minimum value is ${f.min}.`;else if(f.max!=null&&n>f.max)e=`Maximum value is ${f.max}.`;else v=n;}
      else if(f.t==='tel'&&!/^[+\d][\d\s().-]{5,}$/.test(v))e='Enter a valid phone number.';
      else if(f.t==='student'&&!DB.students.some(s=>s.name.toLowerCase()===v.toLowerCase()))e='Choose an existing student from the list.';
      else if(f.t==='date'&&isNaN(Date.parse(v)))e='Enter a valid date.';
    }
    if(e)errs[f.k]=e;data[f.k]=v;
  });
  if(E.check)E.check(data,errs);
  return {data,errs};
}

  const q=msgQ.trim().toLowerCase();
  const list=DB.conversations.filter(c=>!q||c.name.toLowerCase().includes(q)||c.msgs.some(m=>m.text.toLowerCase().includes(q))).sort((a,b)=>lastTs(b)-lastTs(a));
  $('#convList').innerHTML=list.length?list.map(c=>{const l=c.msgs[c.msgs.length-1];return `<button class="conv ${c.unread?'unread':''} ${c.id===msgSel?'active':''}" data-act="conv" data-id="${c.id}" aria-label="${esc(c.name)}${c.unread?', unread':''}">${avatar(c.name,42)}<span class="meta"><span class="row1"><span class="p-name">${esc(c.name)}</span><span>${ago(lastTs(c))}</span></span><span class="prev" style="display:block">${l?(l.me?'You: ':'')+esc(l.text):'No messages'}</span></span>${c.unread?'<span class="udot" title="Unread"></span>':''}</button>`;}).join(''):`<div class="empty"><div class="eic">${icon('inbox',28)}</div><h3>${DB.conversations.length?'No matches':'No conversations'}</h3><p>${DB.conversations.length?'Try a different search.':'Start one with “New message”.'}</p></div>`;
}
function drawThread(){
  const c=DB.conversations.find(x=>x.id===msgSel),el=$('#thread');
  if(!c){el.innerHTML=`<div class="empty" style="margin:auto"><div class="eic">${icon('mail',28)}</div><h3>Select a conversation</h3><p>Choose a conversation from the list or write a new message.</p><button class="btn primary" data-act="newmsg">${icon('plus',18)} New message</button></div>`;return;}
  el.innerHTML=`<div class="th-head"><button class="icon-btn back-btn" data-act="backmsg" aria-label="Back to conversations">${icon('left')}</button>${avatar(c.name,40)}<div><div class="p-name">${esc(c.name)}</div><div class="p-sub">${esc(c.role)}</div></div></div>
  <div class="th-body" id="thBody">${c.msgs.map(m=>`<div class="bubble ${m.me?'me':''}">${esc(m.text)}<small>${fmtTime(m.ts)}</small></div>`).join('')}</div>
  <form class="reply" id="replyForm" novalidate><input id="replyIn" type="text" placeholder="Write a reply…" aria-label="Reply message" maxlength="500" autocomplete="off"><button class="btn primary" type="submit" aria-label="Send reply">${icon('send',18)}<span>Send</span></button></form>`;
  const b=$('#thBody');b.scrollTop=b.scrollHeight;
}
function openConv(id){
  const c=DB.conversations.find(x=>x.id===id);if(!c)return;
  msgSel=id;if(c.unread){void apiRequest(`/messages/${encodeURIComponent(id)}/read`,{method:'PATCH'}).then(()=>{c.unread=false;updateBadges();drawConvs();}).catch(error=>toast(error instanceof Error?error.message:'Messages could not be marked as read.','error'));}
  updateBadges();drawConvs();drawThread();$('#msgWrap').classList.add('show-thread');
}
function openCompose(){
  const contacts=DB.teachers.filter(t=>t.userStatus==='active').map(t=>({id:t.id,name:t.name,role:'Teacher'})).concat(DB.students.filter(s=>s._rawStatus==='active').map(s=>({id:s.id,name:s.name,role:'Student'})));
  openModal(`${mHead('New message')}<form id="composeForm" novalidate><div class="m-body"><div class="fgrid">
   <div class="field full"><label for="c_to">To <span class="req" aria-hidden="true">*</span></label><select id="c_to" name="to" required><option value="">Select a student or teacher…</option>${createSelectOptions(contacts,c=>`${c.name} (${c.role})`)}</select></div>
   <div class="field full"><label for="c_subject">Subject</label><input id="c_subject" name="subject" maxlength="160"></div>
   <div class="field full"><label for="c_msg">Message <span class="req" aria-hidden="true">*</span></label><textarea id="c_msg" name="msg" maxlength="5000" required></textarea><div class="err" id="e_msg" role="alert"></div></div></div>
   <p class="hint" style="margin-top:10px">Messages are stored in EduSphere and the recipient receives a system notification.</p></div>
   <div class="m-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">${icon('send',16)} Send</button></div></form>`);
}
async function submitCompose(form){
  const recipientId=form.elements.to.value,body=form.elements.msg.value.trim(),subject=form.elements.subject.value.trim();
  if(!recipientId||!body){toast('Choose a recipient and enter a message.','error');return;}
  try{
    const result=await apiRequest('/messages',{method:'POST',body:JSON.stringify({recipientId,subject,body})});
    closeModal();await connectSystem();msgSel=result.data.conversationId;msgQ='';render();$('#msgWrap')?.classList.add('show-thread');toast('Message sent.');
  }catch(error){toast(error instanceof Error?error.message:'Message could not be sent.','error');}
}
async function submitReply(form){
  const input=$('#replyIn'),body=input.value.trim(),conversationId=msgSel;
  if(!body){toast('Type a message first.','error');input.focus();return;}
  if(!conversationId)return;
  try{
    await apiRequest(`/messages/${encodeURIComponent(conversationId)}/messages`,{method:'POST',body:JSON.stringify({body})});
    await connectSystem();msgSel=conversationId;renderMessages();$('#msgWrap').classList.add('show-thread');$('#replyIn').focus();updateBadges();
  }catch(error){toast(error instanceof Error?error.message:'Reply could not be sent.','error');}
}

/* =====================================================================
   Settings
   ===================================================================== */
function storageSize(){const a=lsGet(KEY);return a?(a.length/1024).toFixed(0)+' KB':'0 KB';}
function renderSettings(){
  const p=PREFS.profile;
  $('#view').innerHTML=`<div class="page-head"><div><h1 id="pageTitle" tabindex="-1">Settings</h1><p class="sub">Manage your profile, branding and preferences.</p></div></div>
  <div class="set-grid">
   <section class="card card-pad" aria-labelledby="s1"><div class="card-title"><span>${icon('user',22)}</span><h2 id="s1">Admin profile</h2></div>
    <dl class="dl" style="margin-top:14px"><dt>Name</dt><dd>${esc(p.name)}</dd><dt>Email</dt><dd>${esc(p.email)}</dd><dt>Role</dt><dd>${esc(p.role)}</dd></dl>
    <p class="card-sub" style="margin-top:12px">Profile details come from your signed-in EduSphere account.</p></section>
   <section class="card card-pad" aria-labelledby="s2"><div class="card-title"><span>${icon('school',22)}</span><h2 id="s2">Website name</h2></div>
    <p class="card-sub" style="margin:4px 0 14px">EduSphere branding is managed by the system.</p><b>${esc(PREFS.siteName)}</b></section>
   <section class="card card-pad" aria-labelledby="s3"><div class="card-title"><span>${icon('gear',22)}</span><h2 id="s3">Preferences</h2></div>
    <div class="set-row"><div><b>Dark mode</b><small>Switch between light and dark themes.</small></div><button class="switch" role="switch" aria-checked="${PREFS.theme==='dark'}" aria-label="Dark mode" data-act="toggleTheme"></button></div>
    <p class="card-sub" style="margin-top:14px">Notification preferences are not available from the current system API.</p></section>
   <section class="card card-pad" aria-labelledby="s4"><div class="card-title"><span>${icon('reset',22)}</span><h2 id="s4">System connection</h2></div>
    <p class="card-sub" style="margin:8px 0 14px">This dashboard uses the authenticated EduSphere API. Changes are saved to the system database.</p>
    <button class="btn" data-act="refresh">${icon('reset',16)} Refresh system data</button></section>
  </div>`;
}
function submitProfile(f){
  const name=f.elements.name.value.trim(),email=f.elements.email.value.trim(),role=f.elements.role.value.trim()||'Administrator';let ok=true;
  const en=name.length<2?'Name must be at least 2 characters.':'',ee=!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)?'Enter a valid email address.':'';
  $('#e_pname').textContent=en;$('#e_pemail').textContent=ee;
  f.elements.name.setAttribute('aria-invalid',en?'true':'false');f.elements.email.setAttribute('aria-invalid',ee?'true':'false');
  if(en||ee){toast('Please fix the highlighted fields.','error');(en?f.elements.name:f.elements.email).focus();return;}
  PREFS.profile={name,email,role};savePrefs();applyBranding();toast('Profile saved.');
}
function submitSite(f){
  const v=f.elements.site.value.trim(),e=v.length<2?'Website name must be at least 2 characters.':'';
  $('#e_site').textContent=e;f.elements.site.setAttribute('aria-invalid',e?'true':'false');
  if(e){toast(e,'error');f.elements.site.focus();return;}
  PREFS.siteName=v;savePrefs();applyBranding();toast('Website name updated.');
}
function resetDemo(){
  confirmDialog({title:'Reset demo data?',message:'This replaces <b>all</b> records you have added or edited with the original sample data. Your profile and theme preferences are kept. This cannot be undone.',confirmText:'Reset data'},()=>{
    lsDel(KEY);DB=seed();saveDB();UI={};msgSel=null;msgQ='';render();applyBranding();toast('Demo data has been reset.');
  });
}

/* =====================================================================
   Event wiring (delegated)
   ===================================================================== */
async function init(){
  loadPrefs();loadDB();
  buildNav();
  $('#menuBtn').innerHTML=icon('menu',24);$('#gsIcon').innerHTML=icon('search',18);
  $('#bellBtn').innerHTML=icon('bell',22)+'<span class="bell-badge" id="bellBadge" hidden></span>';
  $('#chev').innerHTML=icon('down',16);
  applyTheme();

  $('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.contains('open')?closeSidebar():openSidebar());
  $('#scrim').addEventListener('click',closeSidebar);
  $('#themeBtn').addEventListener('click',()=>setTheme(PREFS.theme==='dark'?'light':'dark'));
  $('#bellBtn').addEventListener('click',e=>{e.stopPropagation();toggleBell();});
  $('#adminBtn').addEventListener('click',e=>{e.stopPropagation();toggleAdmin();});
  $('#gsInput').addEventListener('input',e=>globalSearch(e.target.value));
  $('#gsInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('#gsResults button');if(b)b.click();}});
  window.addEventListener('hashchange',route);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if($('#modalRoot').innerHTML)closeModal();else{closePops();closeSidebar();}}
    if(e.key==='Tab'&&$('#modalRoot .modal')){
      const f=$$('#modalRoot a[href],#modalRoot button:not([disabled]),#modalRoot input,#modalRoot select,#modalRoot textarea').filter(x=>x.offsetParent!==null);
      if(!f.length)return;const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
    }
  });
  document.addEventListener('click',e=>{
    const t=e.target;
    if(!t.closest('.pop-wrap')&&!t.closest('#gsearch'))closePops();
    /* modal close */
    if(t.id==='overlay'||t.closest('[data-close]')){if($('#modalRoot').innerHTML)closeModal();return;}
    const go=t.closest('[data-go]');if(go){e.preventDefault();go.dataset.go&&location.hash!=='#'+go.dataset.go?location.hash='#'+go.dataset.go:route();return;}
    const pg=t.closest('[data-page-go]');
    if(pg&&!pg.disabled){const k=$('#view').dataset.ent;UI[k].page=+pg.dataset.pageGo;drawTable(k);const tb=$('#tbl');if(tb)tb.scrollIntoView({block:'nearest'});return;}
    const a=t.closest('[data-act]');if(!a)return;
    const act=a.dataset.act,id=a.dataset.id,key=$('#view').dataset.ent;
    switch(act){
      case 'refresh':closePops();void refreshSystem();break;
      case 'signout':closePops();void signOutAdmin();break;
      case 'add':openForm(key);break;
      case 'create':openCreateForm(key);break;
      case 'scheduleClass':openScheduleForm();break;
      case 'edit':openForm(key,id);break;
      case 'view':openView(key,id);break;
      case 'status':void updateSystemStatus(key,id);break;
      case 'del':askDelete(key,id);break;
      case 'editfromview':openForm(a.dataset.ent,id);break;
      case 'clear':{const S=UI[key];S.q='';S.f={};S.page=1;renderEntity(key);break;}
      case 'gsopen':closePops();$('#gsInput').value='';openView(a.dataset.ent,id);break;
      case 'allact':showAllActivities();break;
      case 'readall':void markAllNotifs();break;
      case 'notif':void markNotif(id);break;
      case 'goset':closePops();go('settings');break;
      case 'themeSwap':closePops();setTheme(PREFS.theme==='dark'?'light':'dark');break;
      case 'conv':openConv(id);break;
      case 'backmsg':msgSel=null;$('#msgWrap').classList.remove('show-thread');drawConvs();break;
      case 'newmsg':openCompose();break;
      case 'toggleTheme':setTheme(PREFS.theme==='dark'?'light':'dark');toast(`${PREFS.theme==='dark'?'Dark':'Light'} mode enabled.`,'info');break;
    }
  });
  document.addEventListener('submit',e=>{
    e.preventDefault();const f=e.target;
    if(f.id==='recForm')submitForm(f);
    else if(f.id==='systemCreateForm')void submitSystemCreate(f);
    else if(f.id==='scheduleForm')void submitSchedule(f);
    else if(f.id==='composeForm')void submitCompose(f);
    else if(f.id==='profileForm')submitProfile(f);
    else if(f.id==='siteForm')submitSite(f);
    else if(f.id==='replyForm')void submitReply(f);
  });
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='q'){const k=$('#view').dataset.ent;UI[k].q=t.value;UI[k].page=1;drawTable(k);}
    else if(t.id==='mq'){msgQ=t.value;drawConvs();}
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset&&t.dataset.filter){const k=$('#view').dataset.ent;UI[k].f[t.dataset.filter]=t.value;UI[k].page=1;drawTable(k);}
    else if(t.id==='metric')drawLine(t.value);
  });
  currentPage=pageFromHash();
  try{await connectSystem();applyBranding();render();}
  catch(error){const message=error instanceof Error?error.message:'EduSphere system data could not be loaded.';showSystemError(message);}
}
void init();
})();
</script>
